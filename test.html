<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TSW6 Add-on Prices</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      font-size: 1.4rem;
      line-height: 1.8;
    }
  </style>
</head>
<body>

  <div id="scotrail">Loading ScotRail Express price…</div>
  <div id="southhighland">Loading South Highland Extension price…</div>

  <script type="module">

    async function fetchPrice(productId) {
      const url = `https://store.playstation.com/valkyrie-api/de/999/resolve/${productId}`;
      const res = await fetch(url);
      const data = await res.json();

      const priceInfo =
        data.included?.[0]?.attributes?.skus?.[0]?.prices;

      if (!priceInfo) {
        throw new Error("Price information not found");
      }

      return {
        basePrice: priceInfo.basePrice,
        discountedPrice: priceInfo.discountedPrice ?? null,
        currency: priceInfo.currencyCode
      };
    }

    async function showPrices() {
      // ScotRail Express
      try {
        const { basePrice, currency } = await fetchPrice(
          "EP2866-PPSA29953_00-TSW6EDINBURGHGLA"
        );
        document.getElementById("scotrail").textContent =
          `ScotrailExpress add-on is currently ${basePrice} ${currency}`;
      } catch (err) {
        document.getElementById("scotrail").textContent =
          "Could not load ScotRail Express price.";
        console.error(err);
      }

      // South Highland Extension
      try {
        const { basePrice, currency } = await fetchPrice(
          "EP2866-PPSA29953_00-TSW6SOUTHHIGHEXT"
        );
        document.getElementById("southhighland").textContent =
          `South Highland Extension add-on is currently ${basePrice} ${currency}`;
      } catch (err) {
        document.getElementById("southhighland").textContent =
          "Could not load South Highland Extension price.";
        console.error(err);
      }
    }

    showPrices();
  </script>

</body>
</html>
